<!DOCTYPE html>
<html>
<head>
    <title>Security Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            margin: 30px;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        th {
            background: #333;
            color: white;
        }
    </style>
</head>

<body>

<h1>Security Assessment Dashboard</h1>

<table>
<tr>
    <th>ID</th>
    <th>Timestamp</th>
    <th>Finding</th>
    <th>Severity</th>
    <th>Target</th>
    <th>Status</th>
</tr>

{% for alert in alerts %}
<tr>
    <td>{{ alert.id }}</td>
    <td>{{ alert.timestamp }}</td>
    <td>{{ alert.finding }}</td>
    <td>{{ alert.severity }}</td>
    <td>{{ alert.target }}</td>
    <td>{{ alert.status }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
